[project]
name = "billcheck-api"
version = "0.1.0"
description = "BillCheck backend: bill upload, OCR, and audit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Generated by Alembic.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File()/Depends() defaults are the intended pattern.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]
